<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="100%" height="100%" fill="none">
  <!-- DARIS (Darul Istiqomah) Official Formal Landscape Colored Logo -->
  <defs>
    <!-- Filter for crisp presentation -->
    <filter id="cleanShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. LEFT CREST EMBLEM (Lambang Segilima)    -->
  <!-- ========================================== -->
  <g transform="translate(10, 8)" filter="url(#cleanShadow)">
    <!-- Outer 5 Petal/Arc Color Segments -->
    <!-- 1. Top Arc: Warm Orange (#F58220) -->
    <path
      d="M 104 54 C 136 28 174 28 206 54"
      stroke="#F58220"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />
    <!-- 2. Top-Right Arc: Olive/Yellow-Green (#8CC63F) -->
    <path
      d="M 212 59 C 265 106 258 165 240 200"
      stroke="#8CC63F"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />
    <!-- 3. Bottom-Right Arc: Teal Blue (#00A99D) -->
    <path
      d="M 234 208 C 220 262 165 285 155 287"
      stroke="#00A99D"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />
    <!-- 4. Bottom-Left Arc: Magenta/Pink (#EC008C) -->
    <path
      d="M 155 287 C 145 285 90 262 76 208"
      stroke="#EC008C"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />
    <!-- 5. Top-Left Arc: Cyan/Sky Blue (#00AEEF) -->
    <path
      d="M 70 200 C 52 165 45 106 98 59"
      stroke="#00AEEF"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Inner Shield Background -->
    <path
      d="M 155 46 L 235 108 L 204 220 L 155 258 L 106 220 L 75 108 Z"
      fill="#FFFFFF"
      stroke="#E2E8F0"
      stroke-width="1.5"
    />

    <!-- Top Tab Badge: AN MTDI -->
    <path d="M 143 54 L 167 54 L 165 72 L 155 77 L 145 72 Z" fill="#231F20" />
    <text x="155" y="63" text-anchor="middle" font-size="6.5" font-weight="900" fill="#FFFFFF" font-family="system-ui, sans-serif">AN</text>
    <text x="155" y="71" text-anchor="middle" font-size="6.5" font-weight="900" fill="#FFFFFF" font-family="system-ui, sans-serif">MTDI</text>

    <!-- Center Mosque Silhouette & Land Base -->
    <g fill="#231F20">
      <!-- Minaret on Left -->
      <rect x="127" y="112" width="8" height="42" rx="1.5" />
      <path d="M 125.5 112 L 131 92 L 136.5 112 Z" />
      <circle cx="131" cy="89" r="2.5" fill="#F58220" />

      <!-- Center Onion Dome -->
      <path d="M 138 152 C 138 114 155 104 155 104 C 155 104 172 114 172 152 Z" />
      <!-- Dome Crescent Finial -->
      <path d="M 155 103 L 155 94" stroke="#F58220" stroke-width="2" stroke-linecap="round" />
      <circle cx="155" cy="92" r="3.2" fill="#F58220" />

      <!-- Secondary Building & Dome on Right -->
      <rect x="171" y="124" width="10" height="28" rx="1.5" />
      <path d="M 170 124 C 170 114 182 114 182 124 Z" />

      <!-- Bojonegoro Land Base Horizon -->
      <path d="M 98 154 Q 155 166 212 154 L 212 168 Q 155 180 98 168 Z" />
    </g>

    <!-- Paddy Stalk Left (Green #8CC63F) -->
    <g stroke="#8CC63F" fill="#8CC63F">
      <path d="M 96 156 C 88 126 102 96 118 80" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="94" cy="142" r="3.2" />
      <circle cx="97" cy="128" r="3.2" />
      <circle cx="103" cy="114" r="3.2" />
      <circle cx="111" cy="100" r="3.2" />
      <circle cx="118" cy="88" r="3" />
    </g>

    <!-- Cotton / Wheat Stalk Right (Golden Yellow #F7941D) -->
    <g stroke="#F7941D" fill="#F7941D">
      <path d="M 214 156 C 222 126 208 96 192 80" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="216" cy="142" r="3.2" />
      <circle cx="213" cy="128" r="3.2" />
      <circle cx="207" cy="114" r="3.2" />
      <circle cx="199" cy="100" r="3.2" />
      <circle cx="192" cy="88" r="3" />
    </g>

    <!-- Upper Ribbon: WORO - BOJONEGORO -->
    <g>
      <path
        d="M 104 184 Q 155 196 206 184 L 208 198 Q 155 210 102 198 Z"
        fill="#FFFFFF"
        stroke="#231F20"
        stroke-width="1.8"
      />
      <text
        x="155"
        y="194.5"
        text-anchor="middle"
        font-size="7.5"
        font-weight="900"
        letter-spacing="0.6"
        fill="#231F20"
        font-family="system-ui, -apple-system, sans-serif"
      >
        WORO - BOJONEGORO
      </text>
    </g>

    <!-- Lower Ribbon: معهد الطالبين دار الاستقامة -->
    <g>
      <path
        d="M 108 200 Q 155 216 202 200 L 200 214 Q 155 228 110 214 Z"
        fill="#231F20"
      />
      <text
        x="155"
        y="210"
        text-anchor="middle"
        font-size="6.5"
        font-weight="bold"
        fill="#FFFFFF"
        font-family="system-ui, 'Traditional Arabic', serif"
      >
        معهد الطالبين دار الاستقامة
      </text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. RIGHT TYPOGRAPHY BLOCK                  -->
  <!-- ========================================== -->
  <g transform="translate(320, 0)">
    <!-- Top Main Title: Darul Isti[Q]mah -->
    <g transform="translate(0, 192)">
      <!-- "Darul" in Dark Charcoal (#2E3033) -->
      <text
        x="0"
        y="0"
        font-size="108"
        font-weight="800"
        fill="#2E3033"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        letter-spacing="-1"
      >
        Darul
      </text>

      <!-- "Isti" in Teal (#00A99D) -->
      <text
        x="305"
        y="0"
        font-size="108"
        font-weight="800"
        fill="#00A99D"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        letter-spacing="-1"
      >
        Isti
      </text>

      <!-- Interlocking "Q" Emblem (Dual Square Loops) -->
      <g transform="translate(488, -100)">
        <!-- Loop 1 (Lower-Left): Orange (#F58220) -->
        <rect
          x="4"
          y="28"
          width="76"
          height="76"
          rx="22"
          stroke="#F58220"
          stroke-width="19"
          fill="none"
        />
        <!-- Loop 2 (Upper-Right): Magenta (#EC008C) -->
        <rect
          x="38"
          y="4"
          width="76"
          height="76"
          rx="22"
          stroke="#EC008C"
          stroke-width="19"
          fill="none"
        />
        <!-- Interlacing Intersection Overlay -->
        <path
          d="M 38 42 Q 44 60 56 68"
          stroke="#F58220"
          stroke-width="19"
          stroke-linecap="round"
          fill="none"
        />
      </g>

      <!-- "mah" in Teal (#00A99D) -->
      <text
        x="616"
        y="0"
        font-size="108"
        font-weight="800"
        fill="#00A99D"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        letter-spacing="-1"
      >
        mah
      </text>
    </g>

    <!-- Bottom Subtitle: Pesantren Salaf Kekinian -->
    <text
      x="0"
      y="262"
      font-size="36"
      font-weight="600"
      fill="#231F20"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      letter-spacing="0.38em"
    >
      Pesantren Salaf Kekinian
    </text>
  </g>
</svg>
